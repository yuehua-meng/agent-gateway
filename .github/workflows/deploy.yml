name: Deploy

# 手动触发：只在 Actions 页面点「Run workflow」时执行。
# 故意不监听 push —— main 上的提交不会自动上线，部署始终由人点一次确认。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个部署，避免两次点击交叉重建容器。
concurrency:
  group: deploy-agent-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 准备 SSH 密钥
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: 执行部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 网关栈依赖主应用创建的外部网络 vibe-craft_web，主栈没起会在这里失败。
          # BatchMode 让任何需要交互的提示直接失败，而不是把 job 挂死。
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'bash -lc "cd /home/ubuntu/agent-gateway && ./deploy.sh && git log -1 --oneline"' \
              < /dev/null
